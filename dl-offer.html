<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <title>оффер</title>
  <script src="config.js"></script>
  <script src="harness.js"></script>
  <style>
    body{margin:0;height:100vh;display:flex;align-items:center;justify-content:center;background:#17212b}
    .cta{display:flex;align-items:center;justify-content:center;width:80%;height:42%;background:#3390ec;
      color:#fff;text-decoration:none;border-radius:18px;font:800 44px -apple-system,sans-serif}
  </style>
</head>
<body>
  <a id="cta" class="cta" href="ktrdr.html?to=tg%3A%2F%2Fresolve%3Fdomain%3Dtelegram">ЗАЕБИСЬ</a>
  <script>
    var inFrame = self !== top;
    var bridge = getParam('bridge', 'async');
    var delay = parseInt(getParam('delay', '1500'), 10) || 1500;
    beacon('offer:loaded inFrame=' + inFrame + ' bridge=' + bridge, null, inFrame);
    function loadBridge() {
      var s = document.createElement('script'); s.src = 'bridge.js'; document.head.appendChild(s);
    }
    if (bridge === 'inline') { loadBridge(); }
    else if (bridge === 'async') { setTimeout(loadBridge, delay); }
    else if (bridge === 'sync') {
      if (inFrame) {
        document.addEventListener('click', function (e) {
          var a = e.target.closest ? e.target.closest('a') : null;
          if (!a) return;
          var h = a.getAttribute('href') || '';
          if (!h || h.charAt(0) === '#') return;
          e.preventDefault();
          beacon('bridge-sync:top.location SYNC in-gesture ' + h, null, true);
          try { window.top.location.href = h; }
          catch (err) { beacon('bridge-sync:FAILED ' + (err.message || err), null, false); }
        }, true);
      }
      beacon('bridge-sync:inline-ready (sync top-nav) inFrame=' + inFrame, null, true);
    }
    else if (bridge === 'top') {
      document.getElementById('cta').setAttribute('target', '_top');
      beacon('bridge-top: CTA target=_top inFrame=' + inFrame, null, true);
    }
    else if (bridge === 'none') {
      beacon('bridge-none: native, no intercept inFrame=' + inFrame, null, true);
    }
    var ctaUrl = getParam('cta', '');
    if (ctaUrl) { document.getElementById('cta').setAttribute('href', ctaUrl); beacon('offer:cta-override ' + ctaUrl); }
    document.getElementById('cta').addEventListener('click', function () { beacon('offer:cta-tapped'); });
  </script>
</body>
</html>
