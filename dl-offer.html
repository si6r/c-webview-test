<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <title>Telegram: View Test Channel</title>
  <script src="config.js"></script>
  <script src="harness.js"></script>
  <style>
    body{margin:0;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
      background:#17212b;color:#fff;font:16px/1.4 -apple-system,sans-serif;text-align:center;gap:20px;padding:20px;box-sizing:border-box}
    .cta{display:inline-block;background:#3390ec;color:#fff;text-decoration:none;padding:16px 34px;border-radius:10px;font-weight:600}
    small{opacity:.8}
  </style>
</head>
<body>
  <div>Проект Альбины ❤️<br><small>оффер-лендинг</small></div>
  <a id="cta" class="cta" href="ktrdr.html?to=tg%3A%2F%2Fresolve%3Fdomain%3Dtelegram">ПЕРЕЙТИ В КАНАЛ</a>
  <small id="info"></small>
  <script>
    var inFrame = self !== top;
    var bridge = getParam('bridge', 'async');
    var delay = parseInt(getParam('delay', '1500'), 10) || 1500;
    document.getElementById('info').textContent = 'inFrame=' + inFrame + ' | bridge=' + bridge + (bridge === 'async' ? (' (delay ' + delay + 'ms)') : '');
    beacon('offer:loaded inFrame=' + inFrame + ' bridge=' + bridge, null, inFrame);
    function loadBridge() {
      var s = document.createElement('script'); s.src = 'bridge.js'; document.head.appendChild(s);
    }
    if (bridge === 'inline') { loadBridge(); }
    else if (bridge === 'async') { setTimeout(loadBridge, delay); }
    else if (bridge === 'sync') {
      if (inFrame) {
        document.addEventListener('click', function (e) {
          var a = e.target.closest ? e.target.closest('a') : null;
          if (!a) return;
          var h = a.getAttribute('href') || '';
          if (!h || h.charAt(0) === '#') return;
          e.preventDefault();
          beacon('bridge-sync:top.location SYNC in-gesture ' + h, null, true);
          try { window.top.location.href = h; }
          catch (err) { beacon('bridge-sync:FAILED ' + (err.message || err), null, false); }
        }, true);
      }
      beacon('bridge-sync:inline-ready (no external, sync top-nav) inFrame=' + inFrame, null, true);
    }
    document.getElementById('cta').addEventListener('click', function () { beacon('offer:cta-tapped'); });
  </script>
</body>
</html>
