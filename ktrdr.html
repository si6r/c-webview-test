<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <title>kt-rdr (fake)</title>
  <script src="config.js"></script>
  <script src="harness.js"></script>
  <style>
    body{margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;
      color:#fff;font:700 22px/1.4 -apple-system,sans-serif;text-align:center;padding:24px;box-sizing:border-box}
    small{display:block;font-weight:400;font-size:14px;opacity:.9;margin-top:12px}
    code{font-size:12px;opacity:.8;word-break:break-all}
  </style>
</head>
<body>
  <div id="verdict">kt-rdr → строю tg://…</div>
  <script>
    var to = getParam('to', 'tg://resolve?domain=telegram');
    var inFrame = self !== top;
    beacon('ktrdr:reached inFrame=' + inFrame + ' to=' + to, null, !inFrame);
    var v = document.getElementById('verdict');
    if (inFrame) {
      document.body.style.background = '#c92a2a';
      v.innerHTML = '❌ ЗАПЕРТО В IFRAME<small>tg:// сработает ВНУТРИ iframe → браузер его блокирует → канал НЕ откроется. Это и есть баг.</small><small><code>' + to + '</code></small>';
      beacon('ktrdr:VERDICT trapped-in-iframe (баг)', null, false);
    } else {
      document.body.style.background = '#0a7d2c';
      v.innerHTML = '✅ TOP-LEVEL<small>tg:// дошёл до верхнего окна → с установленным Telegram канал бы открылся. Мост/режим сработал.</small><small><code>' + to + '</code></small>';
      beacon('ktrdr:VERDICT reached-top-level (ок)', null, true);
    }
    setTimeout(function () {
      beacon('ktrdr:firing ' + to + ' inFrame=' + inFrame, null, !inFrame);
      window.location.href = to;
    }, 1200);
  </script>
</body>
</html>
